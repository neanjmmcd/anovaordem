<form class="armadura-sheet" autocomplete="off">

  <header class="sheet-header flexrow">
    <img class="item-img" src="{{item.img}}" data-edit="img" height="64" width="64"/>

    <h1>
      <input name="name" type="text" value="{{item.name}}" />
    </h1>
  </header>

  <section>
    <!-- <label>Tipo
      <input type="text" name="system.tipo" value="{{system.tipo}}">
    </label> -->

    <label title="Só armaduras equipadas contam para RD e penalidades">
      <input type="checkbox" name="system.equipado" {{checked system.equipado}}> Equipada
    </label>

    <label>RD Extra
      <input type="number" name="system.rd" value="{{system.rd}}">
    </label>

    <label>Peso
      <input type="number" name="system.peso" value="{{system.peso}}">
    </label>

    <label>Preço Base
      <input type="number" name="system.preco" value="{{system.preco}}">
    </label>

    <fieldset class="aon-tratamento" title="Dano alquímico ignora metade da armadura que não foi tratada para o seu tipo">
      <legend>Tratada contra dano alquímico</legend>
      <label><input type="checkbox" name="system.tratamento.calor" {{checked system.tratamento.calor}}> Térmico (Calor)</label>
      <label><input type="checkbox" name="system.tratamento.frio" {{checked system.tratamento.frio}}> Térmico (Frio)</label>
      <label><input type="checkbox" name="system.tratamento.eletrico" {{checked system.tratamento.eletrico}}> Elétrico</label>
      <label><input type="checkbox" name="system.tratamento.cinetico" {{checked system.tratamento.cinetico}}> Cinético</label>
      <label><input type="checkbox" name="system.tratamento.quimico" {{checked system.tratamento.quimico}}> Químico</label>
    </fieldset>

    <label>Penalidades</label>
    <textarea name="system.penalidades">{{system.penalidades}}</textarea>

    <label>Conceito</label>
    <textarea name="system.conceito">{{system.conceito}}</textarea>
  </section>

</form>
